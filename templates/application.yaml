AWSTemplateFormatVersion: '2010-09-09'
Description: Haunted candy storefront, checkout application, traffic generator, and deployment artifact bucket.
Resources:
  Orders:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
  Artifacts:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  CheckoutRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteOrders
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - !GetAtt Orders.Arn
                  - !Sub '${Orders.Arn}-missing'
  Checkout:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt CheckoutRole.Arn
      Timeout: 10
      MemorySize: 128
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          TABLE_NAME: !Ref Orders
      Code:
        ZipFile: |
          const { DynamoDBClient, PutItemCommand } = require('@aws-sdk/client-dynamodb')
          const { randomUUID } = require('node:crypto')
          const dynamodb = new DynamoDBClient({})

          exports.handler = async event => {
            const body = JSON.parse(event.body || '{}')
            const quantity = body.quantity === undefined ? 1 : body.quantity
            if (!Number.isInteger(quantity) || quantity < 1 || quantity > 20) {
              return { statusCode: 400, body: JSON.stringify({ message: 'Choose between 1 and 20 bags.' }) }
            }
            const order_id = randomUUID()
            console.log({ event: 'checkout.started', order_id })
            if (parseInt(order_id.at(-1), 16) % 4 === 0) {
              console.warn({ event: 'checkout.promotion', message: 'Expired coupon ignored' })
            }
            await dynamodb.send(new PutItemCommand({
              TableName: process.env.TABLE_NAME,
              Item: { order_id: { S: order_id }, item: { S: 'midnight-mix' }, quantity: { N: String(quantity) } },
            }))
            console.log({ event: 'checkout.completed', order_id })
            return { statusCode: 200, body: JSON.stringify({ order_id }) }
          }
  CheckoutLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Checkout}
      RetentionInDays: 7
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-checkout
      ProtocolType: HTTP
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Checkout.Arn
      PayloadFormatVersion: '2.0'
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /checkout
      Target: !Sub integrations/${Integration}
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Checkout
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/checkout
  StorefrontRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadStorefront
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${Artifacts.Arn}/storefront/index.html
  Storefront:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt StorefrontRole.Arn
      Timeout: 10
      Environment:
        Variables:
          ARTIFACT_BUCKET: !Ref Artifacts
      Code:
        ZipFile: |
          const { S3Client, GetObjectCommand } = require('@aws-sdk/client-s3')
          const s3 = new S3Client({})

          exports.handler = async () => {
            const page = await s3.send(new GetObjectCommand({
              Bucket: process.env.ARTIFACT_BUCKET, Key: 'storefront/index.html',
            }))
            return {
              statusCode: 200,
              headers: { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' },
              body: await page.Body.transformToString(),
            }
          }
  StorefrontLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Storefront}
      RetentionInDays: 7
  StorefrontIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Storefront.Arn
      PayloadFormatVersion: '2.0'
  StorefrontRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /
      Target: !Sub integrations/${StorefrontIntegration}
  StorefrontPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Storefront
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/GET/
  TrafficRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeCheckout
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Checkout.Arn
  Traffic:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt TrafficRole.Arn
      Timeout: 50
      Environment:
        Variables:
          APP_FUNCTION: !Ref Checkout
      Code:
        ZipFile: |
          const { LambdaClient, InvokeCommand } = require('@aws-sdk/client-lambda')
          const client = new LambdaClient({})

          exports.handler = async () => {
            const responses = await Promise.all(Array.from({ length: 20 }, () =>
              client.send(new InvokeCommand({
                FunctionName: process.env.APP_FUNCTION, Payload: Buffer.from('{}'),
              }))
            ))
            const result = { requests: responses.length, errors: responses.filter(response => response.FunctionError).length }
            console.log(result)
            return result
          }
  TrafficSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: DISABLED
      Targets:
        - Id: traffic
          Arn: !GetAtt Traffic.Arn
  TrafficPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Traffic
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TrafficSchedule.Arn
Outputs:
  StorefrontUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/
  Endpoint:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/checkout
  FunctionName:
    Value: !Ref Checkout
    Export:
      Name: !Sub ${AWS::StackName}-FunctionName
  FunctionArn:
    Value: !GetAtt Checkout.Arn
    Export:
      Name: !Sub ${AWS::StackName}-FunctionArn
  LogGroup:
    Value: !Ref CheckoutLogs
    Export:
      Name: !Sub ${AWS::StackName}-LogGroup
  TableName:
    Value: !Ref Orders
    Export:
      Name: !Sub ${AWS::StackName}-TableName
  ArtifactBucket:
    Value: !Ref Artifacts
    Export:
      Name: !Sub ${AWS::StackName}-ArtifactBucket
  TrafficRule:
    Value: !Ref TrafficSchedule
  TrafficFunction:
    Value: !Ref Traffic
